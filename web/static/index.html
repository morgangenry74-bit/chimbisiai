<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIMBISIAI — AI Partner</title>
    <style>
        :root {
            --bg-primary: #020617;
            --bg-secondary: #0f172a;
            --bg-chat: #1e293b;
            --accent: #22d3ee;
            --accent-dim: #0891b2;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --user-bg: #164e63;
            --ai-bg: #1e293b;
            --border: #334155;
            --glow: 0 0 20px rgba(34, 211, 238, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--glow);
        }

        .header-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-dim);
            margin-left: auto;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Chat area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 15px;
            animation: fadeIn 0.3s ease;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-user {
            align-self: flex-end;
            background: var(--user-bg);
            border: 1px solid var(--accent-dim);
            border-bottom-right-radius: 4px;
        }

        .message-ai {
            align-self: flex-start;
            background: var(--ai-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-ai .typing {
            display: inline-block;
        }

        .typing-dots::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }

        /* Welcome */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, var(--accent), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome p {
            font-size: 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 24px;
        }

        .suggestion {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-dim);
            transition: all 0.2s;
        }

        .suggestion:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: var(--glow);
        }

        /* Input area */
        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        textarea {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            max-height: 150px;
            min-height: 48px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: var(--glow);
        }

        textarea::placeholder {
            color: var(--text-dim);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--glow);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--bg-primary);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-dim);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .message {
                max-width: 90%;
            }
            .header {
                padding: 12px 16px;
            }
            .chat-container {
                padding: 16px;
            }
            .input-area {
                padding: 12px 16px;
            }
            .suggestions {
                flex-direction: column;
                align-items: center;
            }
        }

        /* Code blocks */
        .message code {
            background: var(--bg-primary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
        }

        .message pre {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message pre code {
            padding: 0;
            background: none;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="header-logo">⚡</div>
        <div class="header-title">CHIMBISIAI</div>
        <div class="header-subtitle">
            <span class="status-dot"></span>
            AI Partner • Powered by Qwen 7B
        </div>
    </div>

    <div class="chat-container" id="chat">
        <div class="welcome" id="welcome">
            <h2>CHIMBISIAI</h2>
            <p>AI-партнёр, не чатбот. Прямой, конкретный, с мнением. Спроси что угодно.</p>
            <div class="suggestions">
                <div class="suggestion" onclick="useSuggestion(this)">Как запустить бизнес с нуля?</div>
                <div class="suggestion" onclick="useSuggestion(this)">Напиши Telegram бота на Python</div>
                <div class="suggestion" onclick="useSuggestion(this)">Разбери мою бизнес-идею</div>
                <div class="suggestion" onclick="useSuggestion(this)">What's the best tech stack for a startup?</div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="input" placeholder="Напиши сообщение..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const welcome = document.getElementById('welcome');
        let messages = [];
        let isGenerating = false;

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 150) + 'px';
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function useSuggestion(el) {
            input.value = el.textContent;
            sendMessage();
        }

        function addMessage(role, content) {
            if (welcome) welcome.style.display = 'none';
            const div = document.createElement('div');
            div.className = `message message-${role === 'user' ? 'user' : 'ai'}`;
            div.textContent = content;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function formatContent(text) {
            // Basic markdown: bold, code, etc
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text || isGenerating) return;

            isGenerating = true;
            sendBtn.disabled = true;
            input.value = '';
            input.style.height = 'auto';

            // Add user message
            messages.push({ role: 'user', content: text });
            addMessage('user', text);

            // Add AI placeholder
            const aiDiv = addMessage('ai', '');
            aiDiv.innerHTML = '<span class="typing-dots"></span>';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages, stream: true })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullContent = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.content) {
                                    fullContent += data.content;
                                    aiDiv.innerHTML = formatContent(fullContent);
                                    chat.scrollTop = chat.scrollHeight;
                                }
                                if (data.done) break;
                                if (data.error) {
                                    aiDiv.textContent = '⚠️ Ошибка: ' + data.error;
                                }
                            } catch (e) {}
                        }
                    }
                }

                messages.push({ role: 'assistant', content: fullContent });
            } catch (e) {
                aiDiv.textContent = '⚠️ Не удалось подключиться к модели. Попробуйте позже.';
            }

            isGenerating = false;
            sendBtn.disabled = false;
            input.focus();
        }

        // Focus input on load
        input.focus();
    </script>
</body>
</html>
