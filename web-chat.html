<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHIMBISIAI v2 — Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
header { background: #1a1a2e; padding: 16px 24px; border-bottom: 1px solid #333; display: flex; align-items: center; gap: 12px; }
header h1 { font-size: 20px; color: #22d3ee; }
header span { font-size: 13px; color: #888; }
#chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { align-self: flex-end; background: #1e3a5f; color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: #1a1a2e; color: #e0e0e0; border-bottom-left-radius: 4px; border: 1px solid #333; }
.msg.bot.loading { color: #888; font-style: italic; }
#input-area { padding: 16px 24px; background: #111; border-top: 1px solid #333; display: flex; gap: 12px; }
#input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #444; background: #1a1a1a; color: #fff; font-size: 15px; outline: none; }
#input:focus { border-color: #22d3ee; }
#send { padding: 12px 24px; background: #22d3ee; color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px; }
#send:hover { background: #06b6d4; }
#send:disabled { background: #555; cursor: not-allowed; }
</style>
</head>
<body>
<header>
<h1>🤖 CHIMBISIAI v2</h1>
<span>Qwen2.5-7B fine-tuned | RTX 3090 | Ollama</span>
</header>
<div id="chat"></div>
<div id="input-area">
<input id="input" placeholder="Напиши что-нибудь..." autocomplete="off">
<button id="send" onclick="sendMsg()">→</button>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });

function addMsg(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMsg() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg(text, 'user');
  sendBtn.disabled = true;
  const loading = addMsg('Думаю...', 'bot loading');
  
  try {
    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: 'chimbisiai:v2', prompt: text, stream: false})
    });
    const data = await resp.json();
    loading.textContent = data.response || 'Ошибка: пустой ответ';
    loading.classList.remove('loading');
  } catch(e) {
    loading.textContent = 'Ошибка: ' + e.message;
    loading.classList.remove('loading');
  }
  sendBtn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
